name: Build Android APK (Capacitor)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build H5
        run: npm run build:h5

      - name: Generate index.html
        run: |
          CSS_LINKS=$(ls dist/css/*.css | sed 's|dist/||' | awk '{print "<link rel=\"stylesheet\" href=\"./"$1"\">"}')
          JS_SCRIPTS=$(ls dist/js/*.js | grep -v LICENSE | sed 's|dist/||' | awk '{print "<script src=\"./"$1"\"></script>"}')
          cat > dist/index.html << HTMLEOF
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
            <meta name="apple-mobile-web-app-capable" content="yes">
            <meta name="apple-mobile-web-app-status-bar-style" content="black">
            <title>Smart Recliner</title>
            $CSS_LINKS
          </head>
          <body>
            <div id="app"></div>
            $JS_SCRIPTS
          </body>
          </html>
          HTMLEOF

      - name: Install Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init sofa-app com.sofa.app --web-dir dist

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Fix Kotlin dependency conflicts
        run: |
          sed -i 's/kotlin-stdlib-jdk7/kotlin-stdlib/g' android/app/build.gradle
          sed -i 's/kotlin-stdlib-jdk8/kotlin-stdlib/g' android/app/build.gradle
          echo ""
          echo "configurations.all {" >> android/app/build.gradle
          echo "    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'" >> android/app/build.gradle
          echo "    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'" >> android/app/build.gradle
          echo "}" >> android/app/build.gradle

      - name: Build Debug APK
        working-directory: ./android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
